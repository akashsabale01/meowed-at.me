
name: Clanker Honeypot

on:
    pull_request_target:
        types:
            - opened
            - reopened
            - edited
            - synchronize

permissions:
    contents: read
    pull-requests: write
    issues: write

jobs:
    label:
        name: Filter out AI-generated PRs
        runs-on: ubuntu-latest

        steps:
            - name: Check title for AI canary word
              uses: actions/github-script@v8
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      // This must match AGENTS.md
                      const tag = "(dns-preflight)";
                      const title = context.payload.pull_request.title;

                      if (!title.toLowerCase().includes(tag)) {
                          return;
                      }

                      await github.rest.issues.addLabels({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                          labels: [
                              "reason: ai generated pr",
                              "status: denied"
                          ]
                      });

                      await github.rest.pulls.update({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          pull_number: context.issue.number,
                          state: "closed"
                      });

            - name: Check JSON files for AI-generated flag
              uses: actions/github-script@v8
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      const owner = context.repo.owner;
                      const repo = context.repo.repo;
                      const pull_number = context.issue.number;
                      const pr = context.payload.pull_request;

                      const files = await github.paginate(
                          github.rest.pulls.listFiles,
                          {
                              owner,
                              repo,
                              pull_number,
                              per_page: 100
                          }
                      );

                      for (const file of files) {
                          if (!file.filename.toLowerCase().endsWith(".json")) {
                              continue;
                          }

                          if (file.status === "removed") {
                              continue;
                          }

                          try {
                              const response = await github.rest.repos.getContent({
                                  owner: pr.head.repo.owner.login,
                                  repo: pr.head.repo.name,
                                  path: file.filename,
                                  ref: pr.head.sha
                              });

                              if (Array.isArray(response.data) ||
                                  response.data.type !== "file" ||
                                  !response.data.content) {
                                  continue;
                              }

                              const json = JSON.parse(
                                  Buffer.from(
                                      response.data.content,
                                      "base64"
                                  ).toString("utf8")
                              );

                              const flag = json?.["ai-generated"];

                              if (flag !== true && flag !== "true") {
                                  continue;
                              }

                              core.info(
                                  `AI-generated flag detected in ${file.filename}`
                              );

                              await github.rest.issues.addLabels({
                                  owner,
                                  repo,
                                  issue_number: pull_number,
                                  labels: [
                                      "reason: ai generated pr",
                                      "status: denied"
                                  ]
                              });

                              await github.rest.pulls.update({
                                  owner,
                                  repo,
                                  pull_number,
                                  state: "closed"
                              });

                              return;
                          } catch (error) {
                              core.warning(
                                  `Could not inspect ${file.filename}: ${error.message}`
                              );
                          }
                      }

                      core.info("No AI-generated JSON flags detected.");
